name: Build and Sign RCNotchMonitor

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile RCNotchMonitor.exe
        shell: pwsh
        run: |
          ./build.ps1
          if (-not (Test-Path "dist/RCNotchMonitor.exe")) {
            throw "dist/RCNotchMonitor.exe was not generated"
          }

      - name: Upload Unsigned Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCNotchMonitor-unsigned
          path: dist/RCNotchMonitor.exe
          if-no-files-found: error

      - name: Submit Signing Request to SignPath.io
        if: vars.SIGNPATH_ORG_ID != '' && github.event_name != 'pull_request'
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'rc-notch-monitor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: RCNotchMonitor-unsigned
          wait-for-completion: true
          output-artifact-name: RCNotchMonitor-signed

      - name: Create GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RCNotchMonitor.exe
          generate_release_notes: true
